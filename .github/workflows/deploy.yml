name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages serves the gh-pages branch, so publishing is just mirroring the site
# there. The artifact-based deploy (actions/deploy-pages) is deliberately not
# used: it requires the Pages source to be set to "GitHub Actions" in repo
# settings, and a workflow token cannot set that itself.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # a shallow clone cannot be pushed to another branch

      - name: Mirror the site to gh-pages
        run: git push --force origin HEAD:gh-pages
